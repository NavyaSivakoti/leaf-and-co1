<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Leaf &amp; Co1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">Leaf &amp; Co1</a>
      <nav class="site-nav">
        <a href="index.html">Shop</a>
        <a href="cart.html">Cart (<span class="badge" id="nav-cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Checkout</h1>

    <form class="panel" id="checkout-form" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" autocomplete="name">
        <p class="error" id="full-name-error"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email">
        <p class="error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" autocomplete="street-address">
        <p class="error" id="address-error"></p>
      </div>

      <button class="btn" type="submit" id="place-order-button">Place order</button>
    </form>
  </main>
</body>
</html>
